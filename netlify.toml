plugins = []
headers = [
  { for = "/*", values = { X-Frame-Options = "SAMEORIGIN" } },
]
redirects = []

[functions]

  [functions."*"]

[build]
publish = "."
publishOrigin = "default"
# توليد assets/js/firebase-env.js من متغيّرات البيئة FIREBASE_* (لوحة Netlify).
